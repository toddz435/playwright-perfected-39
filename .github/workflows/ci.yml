name: CI

# Runs the same gates we run locally — typecheck + unit tests — on every PR and on
# pushes to main, so red code can't merge. Unit tests are pure (no browser), so no
# Playwright browser download is needed here.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
