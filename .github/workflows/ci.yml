name: CI

# Runs the same gates we run locally — typecheck + unit tests — on every PR and on
# pushes to main, so red code can't merge. Unit tests are pure (no browser), so no
# Playwright browser download is needed here.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts skips dependency install scripts (notably @playwright/test's
      # browser download — hundreds of MB that fail/aren't needed on CI). The typecheck and
      # pure unit tests need no browser/native binaries; esbuild's binary ships via its
      # platform optional-dep, not a script, so vitest still works.
      - run: npm ci --ignore-scripts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
