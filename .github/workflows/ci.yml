name: CI

# Runs the same gates we run locally — typecheck + unit tests — on every PR and on
# pushes to main, so red code can't merge. Unit tests are pure (no browser), so no
# Playwright browser download is needed here.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # This is a bun-managed project (bun.lock is canonical); package-lock.json drifts and
      # npm 10 vs 11 resolve it differently, so strict `npm ci` is brittle here. `npm install`
      # reconciles instead of hard-failing on the sync invariant. --ignore-scripts skips
      # dependency install scripts (notably @playwright/test's browser download — large and
      # not needed: CI only typechecks and runs pure unit tests; esbuild's binary ships via a
      # platform optional-dep, not a script, so vitest still works).
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
